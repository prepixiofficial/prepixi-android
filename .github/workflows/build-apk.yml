
name: Build PREPIXI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "PREPIXI-Android-Offline.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract prepared project
        run: |
          mkdir -p app
          unzip -q PREPIXI-Android-Offline.zip -d app
          test -f app/package.json

      - name: Install dependencies
        working-directory: app
        run: |
          rm -f package-lock.json
          bun install

      - name: Build web assets
        working-directory: app
        run: bun run build

      - name: Generate Android project
        working-directory: app
        run: |
          bunx cap add android
          bunx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: prepixi-cards-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
