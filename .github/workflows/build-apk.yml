name: Build PREPIXI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "PREPIXI-Android-Offline.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract prepared project
        run: |
          mkdir -p app
          unzip -q PREPIXI-Android-Offline.zip -d app
          cd app
          test -f package.json

      - name: Install dependencies and build web assets
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Generate Android project and sync local web assets
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prepixi-cards-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
